<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Türkçe A2 Testi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one calm card per screen, big 2x2 answer tiles, soft blue-green paper */
:root{
  --bg:#EAF2F1; --card:#FFFFFF; --ink:#24324A; --soft:#62718A; --line:#D5E2E0;
  --teal:#2C8C80; --teal-l:#DDF1EE; --lav:#6E63C6; --lav-l:#ECEAFB; --sun:#E9A93A; --sun-l:#FCF1DC;
  --ok:#2E9E5B; --ok-l:#E2F5E8; --bad:#D2554B; --bad-l:#FBE6E3;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 32px);-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
[hidden]{display:none!important}
.card{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 4px 0 var(--line)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;padding:14px 22px;font-weight:800;font-size:19px;background:var(--teal);color:#fff;box-shadow:0 4px 0 #1E6A60;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1E6A60}
.btn[disabled]{background:#B9C9C7;box-shadow:0 4px 0 #9FB0AE;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.lav{background:var(--lav);box-shadow:0 4px 0 #4E449C}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* start */
.hero{text-align:center;display:grid;gap:14px}
.hero .big{font-size:64px;line-height:1}
.hero h1{font-size:clamp(34px,8vw,46px);color:var(--teal)}
.hero .sub{color:var(--soft);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border-radius:999px;padding:6px 14px;font-weight:800;font-size:16px}
.c-kelime{background:var(--sun-l);color:#8A5A07}
.c-okuma{background:var(--teal-l);color:#1E6A60}
.c-dinleme{background:var(--lav-l);color:#4E449C}
.c-konusma{background:#FCE7EF;color:#A23B67}
.uz{background:var(--bg);border-radius:16px;padding:12px 14px;font-size:15px;color:var(--soft);font-weight:700;text-align:left}
.field{display:grid;gap:6px;text-align:left}
.field label{font-weight:800}
.field input{border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:20px;background:#fff}

/* question */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top .count{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{flex:1;height:12px;border-radius:999px;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.art{font-size:clamp(56px,14vw,76px);line-height:1.1;text-align:center;margin:6px 0 10px;letter-spacing:4px}
.passage{background:var(--teal-l);border-radius:18px;padding:14px 16px;margin:0 0 14px;font-size:18px}
.passage p{margin:0 0 6px}.passage p:last-child{margin:0}
.passage b{color:#1E6A60}
.listen{display:flex;align-items:center;gap:14px;background:var(--lav-l);border-radius:18px;padding:14px 16px;margin:0 0 14px}
.listen .play{width:64px;height:64px;border-radius:50%;background:var(--lav);color:#fff;font-size:30px;box-shadow:0 4px 0 #4E449C;flex:none}
.listen .play.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.listen div{font-weight:800;color:#4E449C}
.listen small{display:block;font-weight:700;color:var(--soft);font-size:14px}
.qtext{font-size:clamp(21px,5vw,24px);font-weight:800;margin:0 0 16px;display:flex;gap:10px;align-items:flex-start}
.qtext span{flex:1;min-width:0}
.say{flex:none;width:42px;height:42px;border-radius:12px;background:var(--bg);font-size:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.opts:not(.pics){grid-template-columns:1fr}}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px;min-height:76px;font-size:19px;font-weight:800;transition:transform .1s,border-color .15s,background .15s}
.opt:active{transform:scale(.98)}
.opt .L{flex:none;width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--soft)}
.opt .e{font-size:32px;line-height:1;flex:none}
.opt .t{min-width:0}
.opt.sel{border-color:var(--lav);background:var(--lav-l)}
.opt.sel .L{background:var(--lav);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opts.pics .opt{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:12px 8px}
.opts.pics .opt .L{position:absolute;top:8px;left:8px}
.opts.pics svg{width:100%;max-width:120px;height:auto}
.opts.pics .t{font-size:15px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.feedback{margin-top:14px;border-radius:18px;padding:14px 16px;font-weight:800;font-size:18px}
.feedback.ok{background:var(--ok-l);color:#1F6E3F}
.feedback.bad{background:var(--bad-l);color:#9B342C}
.feedback.try{background:var(--sun-l);color:#7A4E05}

/* result */
.score{display:grid;justify-items:center;gap:8px;text-align:center}
.ring{width:190px;height:190px;max-width:100%}
.ring text{font-family:var(--display);font-weight:800}
.stars{font-size:40px;letter-spacing:6px}
.msg{font-size:22px;font-weight:800}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:520px){.skills{grid-template-columns:repeat(2,1fr)}}
.sk{border-radius:16px;padding:10px;text-align:center;font-weight:800}
.sk b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.meta{color:var(--soft);font-weight:700;font-size:15px}

/* review */
.rv{display:grid;gap:10px;margin-top:14px}
.ri{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:#fff;border-radius:18px;padding:14px;border-left:8px solid var(--line)}
.ri.ok{border-left-color:var(--ok)}.ri.bad{border-left-color:var(--bad)}.ri.fixed{border-left-color:var(--sun)}
.ri .n{font-family:var(--display);font-size:22px;font-weight:800;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.ri.ok .n{background:var(--ok-l);color:var(--ok)}.ri.bad .n{background:var(--bad-l);color:var(--bad)}.ri.fixed .n{background:var(--sun-l);color:#8A5A07}
.ri .q{font-weight:800;min-width:0}
.ri .a{font-size:16px;font-weight:700;color:var(--soft);margin-top:4px}
.ri .a .y{color:var(--bad)}.ri .a .g{color:var(--ok)}
.ri .btn{padding:8px 14px;font-size:16px;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;font-weight:700;color:var(--soft);margin-top:10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const KEYS=(function(){const raw=atob(K);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  const out=[];let p=0;for(let i=0;i<Q.length;i++){const n=bytes[p]^((i*29+5)&255);p++;const seg=new Uint8Array(n);
  for(let j=0;j<n;j++)seg[j]=bytes[p+j]^((i*37+11+j*7)&255);p+=n;out.push(JSON.parse(new TextDecoder().decode(seg)));}return out;})();
const right=i=>KEYS[i].a;

let S=load()||fresh();
function fresh(){return {name:"",ans:Array(Q.length).fill(null),done:false,score:null,date:null,retry:{},cur:0,screen:"start"};}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.ans&&s.ans.length===Q.length)return s;}catch(e){}return null;}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}

// audio
let player=null;
function play(key,btn){try{if(player){player.pause();document.querySelectorAll(".on").forEach(b=>b.classList.remove("on"));}
  if(!CLIPS[key])return;player=new Audio(CLIPS[key]);if(btn){btn.classList.add("on");player.onended=()=>btn.classList.remove("on");}
  player.play().catch(()=>{});}catch(e){}}

// pictures
function face(hair,glasses){const H={black:"#2B2B33",blond:"#F2C94C",red:"#D9622B"}[hair];
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="64" r="38" fill="#F6D2B5"/>
  <path d="M22 60c0-26 16-40 38-40s38 14 38 40c-8-12-20-18-38-18S30 48 22 60z" fill="${H}"/>
  <circle cx="46" cy="66" r="5" fill="#3B6FD1"/><circle cx="74" cy="66" r="5" fill="#3B6FD1"/>
  <path d="M48 84q12 9 24 0" stroke="#9A4B3A" stroke-width="4" fill="none" stroke-linecap="round"/>
  ${glasses?`<g fill="none" stroke="#2B2B33" stroke-width="3.5"><circle cx="46" cy="66" r="11"/><circle cx="74" cy="66" r="11"/><path d="M57 66h6M35 64l-9-3M85 64l9-3"/></g>`:""}</svg>`;}
function weather(k){const cloud=`<path d="M34 78h52a16 16 0 0 0 0-32 22 22 0 0 0-42-4 18 18 0 0 0-10 36z" fill="#C9D6E3"/>`;
  if(k==="sun")return `<svg viewBox="0 0 120 120" aria-hidden="true"><g stroke="#E9A93A" stroke-width="6" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="60" y1="16" x2="60" y2="28" transform="rotate(${a} 60 60)"/>`).join("")}</g><circle cx="60" cy="60" r="24" fill="#F6C343"/></svg>`;
  if(k==="rain")return `<svg viewBox="0 0 120 120" aria-hidden="true">${cloud}<g stroke="#3B8BD1" stroke-width="5" stroke-linecap="round"><line x1="44" y1="88" x2="38" y2="102"/><line x1="62" y1="88" x2="56" y2="102"/><line x1="80" y1="88" x2="74" y2="102"/></g></svg>`;
  if(k==="snow")return `<svg viewBox="0 0 120 120" aria-hidden="true">${cloud}<g fill="#7FA9D6"><circle cx="42" cy="94" r="5"/><circle cx="60" cy="100" r="5"/><circle cx="78" cy="94" r="5"/><circle cx="51" cy="108" r="4"/><circle cx="70" cy="110" r="4"/></g></svg>`;
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="78" cy="44" r="18" fill="#F6C343"/>${cloud}</svg>`;}
function pic(code){const p=code.split(":");return p[0]==="face"?face(p[1],p[2]==="1"):weather(p[1]);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function passage(t){return `<div class="passage">${t.split("\n").map(l=>{const m=l.match(/^([^:]{2,22}):\s(.*)$/);return `<p>${m?`<b>${esc(m[1])}:</b> ${esc(m[2])}`:esc(l)}</p>`;}).join("")}</div>`;}
function chip(s){return `<span class="chip c-${s}">${SK[s][0]} ${SK[s][1]}</span>`;}

function qBody(i){const q=Q[i];let h=`<div class="qhead">${chip(q.s)}<span class="meta">${q.u}. ünite</span></div>`;
  h+=`<div class="art" aria-hidden="true">${q.art}</div>`;
  if(q.p)h+=passage(q.p);
  if(q.l)h+=`<div class="listen"><button class="play" data-play="l${i}" aria-label="Dinle">🔊</button><div>Önce dinle!<small>İstediğin kadar tekrar dinleyebilirsin.</small></div></div>`;
  h+=`<div class="qtext"><span>${esc(q.q)}</span><button class="say" data-play="q${i}" aria-label="Soruyu dinle">🔈</button></div>`;
  h+=`<div class="opts${q.pic?" pics":""}">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="L">${LET[k]}</span>${q.pic?pic(o[1]):`<span class="e" aria-hidden="true">${o[1]}</span>`}<span class="t">${esc(o[0])}</span></button>`).join("")}</div>`;
  return h;}

function bindPlay(root){root.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>play(b.dataset.play,b));}

// screens
function render(){window.scrollTo(0,0);({start:Start,quiz:Quiz,result:Result,review:Review,retry:Retry})[S.screen]();}

function Start(){
  app.innerHTML=`<div class="card hero">
   <div class="big" aria-hidden="true">🦉📚</div>
   <h1>Türkçe A2 Testi</h1>
   <div class="sub">1–5. üniteler · 30 soru · 100 puan</div>
   <div class="chips">${chip("kelime")}${chip("okuma")}${chip("dinleme")}${chip("konusma")}</div>
   <div class="uz">🇺🇿 Har bir savolda 4 ta javob bor, bittasini tanla. 🎧 belgili savollarda avval ovozni tingla. Test oxirida ballingni ko‘rasan va xatolaringni qaytadan ishlaysan.</div>
   <div class="field"><label for="nm">Adın ne?</label><input id="nm" autocomplete="off" value="${esc(S.name)}" placeholder="Adını yaz"></div>
   <button class="btn" id="go">Teste başla ▶</button>
  </div>`;
  document.getElementById("go").onclick=()=>{S.name=document.getElementById("nm").value.trim();S.screen="quiz";S.cur=S.ans.findIndex(a=>a===null);if(S.cur<0)S.cur=0;save();render();};
}

function Quiz(){const i=S.cur,last=i===Q.length-1;
  app.innerHTML=`<div class="top"><span class="count">Soru ${i+1} / ${Q.length}</span><div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div></div>
  <div class="card">${qBody(i)}
   <div class="nav"><button class="btn ghost" id="prev" ${i===0?"hidden":""}>◀ Geri</button><span></span>
   <button class="btn${last?" lav":""}" id="next" ${S.ans[i]===null?"disabled":""}>${last?"Testi bitir ✓":"Sonraki ▶"}</button></div></div>`;
  bindPlay(app);
  const opts=[...app.querySelectorAll(".opt")];
  const mark=()=>opts.forEach((b,k)=>b.classList.toggle("sel",S.ans[i]===k));mark();
  opts.forEach(b=>b.onclick=()=>{S.ans[i]=+b.dataset.k;save();mark();document.getElementById("next").disabled=false;});
  document.getElementById("prev").onclick=()=>{S.cur--;save();render();};
  document.getElementById("next").onclick=()=>{if(S.ans[i]===null)return;if(last)finish();else{S.cur++;save();render();}};
}

function finish(){const c=S.ans.filter((a,i)=>a===right(i)).length;S.score=Math.round(c/Q.length*100);S.done=true;S.date=new Date().toLocaleString("tr-TR");S.screen="result";save();render();}

function Result(){const c=S.ans.filter((a,i)=>a===right(i)).length,sc=S.score;
  const stars=sc>=90?3:sc>=70?2:sc>=50?1:0;
  const msg=sc>=90?"Harikasın! Çok iyi bildin! 🎉":sc>=70?"Çok güzel! Biraz daha çalışalım. 👏":sc>=50?"Fena değil! Yanlışlarını birlikte düzeltelim. 💪":"Hiç sorun değil! Tekrar yaparak öğreniriz. 🌱";
  const C=2*Math.PI*78,off=C*(1-sc/100);
  const by={};Q.forEach((q,i)=>{by[q.s]=by[q.s]||[0,0];by[q.s][1]++;if(S.ans[i]===right(i))by[q.s][0]++;});
  const fixed=Object.values(S.retry).filter(r=>r.ok).length,wrong=Q.length-c;
  app.innerHTML=`<div class="card score">
   <h2>${S.name?esc(S.name)+", t":"T"}est bitti!</h2>
   <svg class="ring" viewBox="0 0 190 190" role="img" aria-label="Puan ${sc} / 100"><circle cx="95" cy="95" r="78" fill="none" stroke="#E4ECEB" stroke-width="18"/>
   <circle cx="95" cy="95" r="78" fill="none" stroke="${sc>=70?"#2E9E5B":sc>=50?"#E9A93A":"#D2554B"}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 95 95)"/>
   <text x="95" y="102" text-anchor="middle" font-size="52" fill="#24324A">${sc}</text><text x="95" y="132" text-anchor="middle" font-size="18" fill="#62718A">/ 100 puan</text></svg>
   <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
   <div class="msg">${msg}</div>
   <div class="meta">${Q.length} sorudan <b>${c}</b> doğru, <b>${wrong}</b> yanlış · ${esc(S.date||"")}</div>
   ${wrong?`<div class="meta">Tekrarda düzeltilen: <b>${fixed}</b> / ${wrong}</div>`:""}
  </div>
  <div class="skills">${Object.keys(SK).map(s=>`<div class="sk c-${s}">${SK[s][0]} ${SK[s][1]}<b>${by[s][0]}/${by[s][1]}</b></div>`).join("")}</div>
  <div class="row" style="margin-top:18px">
   <button class="btn" id="rv">Cevaplarıma bak 🔍</button>
   ${wrong>fixed?`<button class="btn lav" id="rt">Yanlışlarımı tekrar çöz 🔁</button>`:""}
  </div>
  <div class="row" style="margin-top:22px"><button class="btn ghost" id="reset">Testi baştan başlat</button></div>
  <div id="sure" class="card" hidden style="margin-top:12px"><b>Emin misin?</b> <span class="meta">Puanın ve cevapların silinecek.</span><div class="row" style="margin-top:10px"><button class="btn" id="yes" style="background:var(--bad);box-shadow:0 4px 0 #9B342C">Evet, sil</button><button class="btn ghost" id="no">Vazgeç</button></div></div>`;
  document.getElementById("rv").onclick=()=>{S.screen="review";save();render();};
  const rt=document.getElementById("rt");if(rt)rt.onclick=()=>startRetry();
  document.getElementById("reset").onclick=()=>{document.getElementById("sure").hidden=false;};
  document.getElementById("no").onclick=()=>{document.getElementById("sure").hidden=true;};
  document.getElementById("yes").onclick=()=>{const n=S.name;S=fresh();S.name=n;save();render();};
}

function Review(){
  app.innerHTML=`<div class="top"><button class="btn ghost" id="bk">◀ Puanım</button><h2 style="flex:1">Cevaplarım</h2></div>
  <div class="legend"><span><i class="dot" style="background:var(--ok)"></i>Doğru</span><span><i class="dot" style="background:var(--bad)"></i>Yanlış</span><span><i class="dot" style="background:var(--sun)"></i>Tekrarda düzelttim</span></div>
  <div class="rv">${Q.map((q,i)=>{const ok=S.ans[i]===right(i),r=S.retry[i],cls=ok?"ok":r&&r.ok?"fixed":"bad";
    const mine=`Senin cevabın: <span class="${ok?"g":"y"}">${LET[S.ans[i]]}) ${esc(q.o[S.ans[i]][0])}</span>`;
    let extra="";
    if(!ok){if(r&&r.seen)extra=`<br>Doğru cevap: <span class="g">${LET[right(i)]}) ${esc(q.o[right(i)][0])}</span> · ${esc(KEYS[i].w)}`;
      else extra=`<br><button class="btn lav" data-one="${i}">Tekrar dene 🔁</button>`;}
    return `<div class="ri ${cls}"><div class="n">${ok?"✓":cls==="fixed"?"★":"✗"}</div><div style="min-width:0"><div class="q">${i+1}. ${esc(q.q)}</div><div class="a">${mine}${extra}</div></div></div>`;}).join("")}</div>`;
  document.getElementById("bk").onclick=()=>{S.screen="result";save();render();};
  app.querySelectorAll("[data-one]").forEach(b=>b.onclick=()=>startRetry(+b.dataset.one));
}

let RQ=[],RP=0;
function startRetry(only){RQ=only!=null?[only]:Q.map((q,i)=>i).filter(i=>S.ans[i]!==right(i)&&!(S.retry[i]&&S.retry[i].seen));if(!RQ.length){S.screen="review";render();return;}RP=0;S.screen="retry";render();}
function Retry(){const i=RQ[RP];const r=S.retry[i]||(S.retry[i]={tries:0,ok:false,seen:false});
  app.innerHTML=`<div class="top"><span class="count">Tekrar ${RP+1} / ${RQ.length}</span><div class="bar"><i style="width:${RP/RQ.length*100}%;background:var(--lav)"></i></div></div>
  <div class="card"><div class="meta" style="margin-bottom:6px">Bu ${i+1}. soru. İlk cevabın yanlıştı, bir daha dene!</div>${qBody(i)}<div id="fb"></div>
  <div class="nav"><button class="btn ghost" id="out">◀ Cevaplarım</button><button class="btn" id="nx" hidden>${RP===RQ.length-1?"Bitir ✓":"Sonraki ▶"}</button></div></div>`;
  bindPlay(app);
  const opts=[...app.querySelectorAll(".opt")],fb=document.getElementById("fb"),nx=document.getElementById("nx");
  opts.forEach((b,k)=>{if(k===S.ans[i]){b.classList.add("wrong");b.disabled=true;}});
  const end=()=>{opts.forEach(b=>b.disabled=true);opts[right(i)].classList.add("right");r.seen=true;save();nx.hidden=false;};
  opts.forEach(b=>b.onclick=()=>{const k=+b.dataset.k;r.tries++;
    if(k===right(i)){r.ok=true;fb.innerHTML=`<div class="feedback ok">Aferin, doğru! 🎉 ${esc(KEYS[i].w)}</div>`;play("",null);end();}
    else{b.classList.add("wrong");b.disabled=true;
      if(r.tries>=2){fb.innerHTML=`<div class="feedback bad">Doğru cevap: ${LET[right(i)]}) ${esc(Q[i].o[right(i)][0])}. ${esc(KEYS[i].w)}</div>`;end();}
      else fb.innerHTML=`<div class="feedback try">Olmadı, bir kez daha dene! 🙂</div>`;}
    save();});
  nx.onclick=()=>{if(RP<RQ.length-1){RP++;render();}else{S.screen="review";save();render();}};
  document.getElementById("out").onclick=()=>{S.screen="review";save();render();};
}

if(S.screen==="retry")S.screen="review";
render();
})();
</script>
</body>
</html>
